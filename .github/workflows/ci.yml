name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint, test, and coverage
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format Check
        run: npm run format:check

      # npm ci already builds and type-checks src via the prepare script
      # (npm run dist). These cover what that build does not.
      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Typecheck src without test globals
        if: ${{ !cancelled() }}
        run: npx tsc --noEmit -p tsconfig.build.json

      - name: Typecheck src and tests
        if: ${{ !cancelled() }}
        run: npx tsc --noEmit

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: warn
          retention-days: 14
