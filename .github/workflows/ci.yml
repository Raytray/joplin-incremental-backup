name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR cancels its older run; runs on main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint-and-test:
    name: Lint, test, and coverage
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format Check
        run: npm run format:check

      # npm ci already builds and type-checks src via the prepare script
      # (npm run dist). These cover what that build does not.
      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Typecheck src without test globals
        if: ${{ !cancelled() }}
        run: npx tsc --noEmit -p tsconfig.build.json

      - name: Typecheck src and tests
        if: ${{ !cancelled() }}
        run: npx tsc --noEmit

      - name: Upload coverage report
        # Artifact actions v4+ refuse to run off github.com (GHES check), e.g. on Forgejo.
        if: always() && github.server_url == 'https://github.com'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: warn
          retention-days: 14

  e2e:
    name: End-to-end (Joplin ${{ matrix.joplin }})
    # Pinned: the apt package names below are for 24.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        # Oldest supported (app_min_version) and the pinned current release.
        joplin: ['3.2.11', '3.7.22']

    env:
      JOPLIN_VERSION: ${{ matrix.joplin }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libasound2t64 libgbm1 libgtk-3-0t64 libnss3 libxss1

      # Installing also builds the plugin into dist/ (prepare runs npm run dist).
      - name: Install dependencies
        run: npm ci

      - name: Cache Joplin
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/joplin/${{ matrix.joplin }}
          key: joplin-${{ runner.os }}-${{ matrix.joplin }}-${{ hashFiles('scripts/fetch-joplin.sh') }}

      - name: Fetch Joplin
        run: scripts/fetch-joplin.sh

      # Call vitest directly: npm ci already built dist/, so skip pretest:e2e.
      - name: Run end-to-end tests
        run: xvfb-run -a npx vitest run --config vitest.e2e.config.ts
        env:
          JOPLIN_E2E_WORKDIR: ${{ runner.temp }}/joplin-e2e

      - name: Upload Joplin logs
        # Artifact actions v4+ refuse to run off github.com (GHES check), e.g. on Forgejo.
        if: failure() && github.server_url == 'https://github.com'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-logs-joplin-${{ matrix.joplin }}
          path: |
            ${{ runner.temp }}/joplin-e2e/*/*.log
            ${{ runner.temp }}/joplin-e2e/*/profile/log*.txt
            ${{ runner.temp }}/joplin-e2e/*/backups/**/manifest.json
            /dev/shm/joplin-e2e-backups-*/backups/**/manifest.json
          if-no-files-found: warn
          retention-days: 14
