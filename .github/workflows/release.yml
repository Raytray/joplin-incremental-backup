name: Release

# Push a tag like v1.0.6 (matching package.json and src/manifest.json) from a
# commit on main. Publishes to npm through npm trusted publishing (OIDC, no
# stored token, provenance attached) and creates a GitHub Release.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Publish to npm and create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the GitHub Release
      id-token: write # npm trusted publishing

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Node 24 ships npm 11, which trusted publishing needs (>= 11.5.1).
      # No dependency cache here, so a poisoned cache cannot reach a release.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Check tag matches package.json and manifest
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          manifest="$(node -p "require('./src/manifest.json').version")"
          echo "tag=$tag package.json=$pkg manifest=$manifest"
          if [ "$tag" != "$pkg" ] || [ "$tag" != "$manifest" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json ($pkg) and src/manifest.json ($manifest)"
            exit 1
          fi

      # main only takes changes that passed CI (see the "Protect main" ruleset).
      - name: Check the tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at a commit that is not on main"
            exit 1
          fi

      # Also builds publish/ via the prepare script.
      - name: Install dependencies
        run: npm ci

      - name: Lint, test, and typecheck
        run: |
          npm run lint
          npm test
          npx tsc --noEmit

      - name: Publish to npm
        run: npm publish --provenance --access public

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" publish/*.jpl --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
